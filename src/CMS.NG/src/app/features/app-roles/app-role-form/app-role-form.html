<form [formGroup]="form" (ngSubmit)="save()">
  <div class="cms-card cms-page-header">
    <div class="cms-page-header__titles">
      <h1 class="cms-page-header__title" data-testid="form-title">{{ title }}</h1>
    </div>

    <div class="cms-page-header__actions">
      <p-button
        type="button"
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        (onClick)="cancel()"
      />
      <p-button
        type="submit"
        label="儲存"
        icon="pi pi-check"
        [loading]="saving()"
        data-testid="save-role"
      />
    </div>
  </div>

  <div class="cms-card">
    <div class="cms-card__body">
      <h2 class="cms-card__title">角色資料</h2>

      <div class="cms-field">
        <label class="cms-field__label" for="roleId">
          角色代碼 <span class="cms-field__required">*</span>
        </label>
        <input
          pInputText
          id="roleId"
          formControlName="roleId"
          placeholder="請輸入角色代碼"
          data-testid="input-role-id"
        />
        @if (isEdit) {
          <small class="cms-field__hint">角色代碼為使用者關聯的鍵值，建立後不可變更。</small>
        }
        @if (isInvalid('roleId')) {
          <small class="cms-field__error" data-testid="error-role-id">角色代碼為必填。</small>
        }
      </div>

      <div class="cms-field">
        <label class="cms-field__label" for="roleName">
          角色名稱 <span class="cms-field__required">*</span>
        </label>
        <input
          pInputText
          id="roleName"
          formControlName="roleName"
          data-testid="input-role-name"
        />
        @if (isInvalid('roleName')) {
          <small class="cms-field__error" data-testid="error-role-name">角色名稱為必填。</small>
        }
      </div>

      <div class="cms-field">
        <label class="cms-field__label" for="permissionLevel">
          權限等級 <span class="cms-field__required">*</span>
        </label>
        <p-inputnumber
          inputId="permissionLevel"
          formControlName="permissionLevel"
          [min]="0"
          [useGrouping]="false"
        />
        @if (isInvalid('permissionLevel')) {
          <small class="cms-field__error" data-testid="error-permission-level">
            權限等級為必填，且必須大於或等於 0。
          </small>
        }
      </div>

      <div class="cms-field">
        <label class="cms-field__label" for="description">描述</label>
        <textarea
          pTextarea
          id="description"
          formControlName="description"
          rows="2"
          [autoResize]="true"
          data-testid="input-description"
        ></textarea>
        @if (isInvalid('description')) {
          <small class="cms-field__error">描述長度不可超過 400 字。</small>
        }
      </div>
    </div>
  </div>

  <div class="cms-card">
    <div class="cms-card__body">
      <h2 class="cms-card__title">使用者</h2>

      <div class="cms-field">
        <p-multiselect
          inputId="userIds"
          formControlName="userIds"
          optionLabel="label"
          optionValue="userId"
          placeholder="選擇使用者（可複選）"
          appendTo="body"
          [options]="users()"
          [filter]="true"
          [showClear]="true"
          [maxSelectedLabels]="9999"
          [virtualScroll]="users().length >= 100"
          [virtualScrollItemSize]="43"
          data-testid="input-users"
        />
      </div>
    </div>
  </div>
</form>
