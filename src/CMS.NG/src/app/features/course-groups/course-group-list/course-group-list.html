<div class="cms-card cms-page-header">
  <div class="cms-page-header__titles">
    <h1 class="cms-page-header__title">課程群組 CourseGroup</h1>
    <span class="cms-page-header__subtitle">課程系列分類</span>
  </div>

  <div class="cms-page-header__actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [text]="true"
      [badge]="hasActiveFilters ? '!' : undefined"
      data-testid="open-filters"
      (onClick)="drawerVisible.set(true)"
    />
    <p-button label="新增" icon="pi pi-plus" data-testid="add-group" (onClick)="goToNew()" />
  </div>
</div>

<div class="cms-card">
  <p-table
    [value]="groups()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="pageState.rows"
    [first]="pageState.first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [sortField]="sortState.sortField"
    [sortOrder]="sortState.sortOrder"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    styleClass="p-datatable-sm"
    data-testid="group-table"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">群組名稱 <p-sortIcon field="description" /></th>
        <th pSortableColumn="courseCount" style="width: 8rem" class="cms-cell--number">
          對應課程 <p-sortIcon field="courseCount" />
        </th>
        <th pSortableColumn="partnerCourseGroupCount" style="width: 12rem" class="cms-cell--number">
          對應廠商課程群組 <p-sortIcon field="partnerCourseGroupCount" />
        </th>
        <th style="width: 10rem" class="cms-cell--actions">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-group>
      <tr data-testid="group-row">
        <td>{{ group.pkid }}</td>
        <td>{{ group.description }}</td>
        <td class="cms-cell--number">{{ group.courseCount }}</td>
        <td class="cms-cell--number">{{ group.partnerCourseGroupCount }}</td>
        <td class="cms-cell--actions">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            [routerLink]="['/course-groups', group.pkid]"
          />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            [routerLink]="['/course-groups', group.pkid, 'edit']"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            data-testid="delete-group"
            (onClick)="confirmDelete(group)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="cms-empty">查無符合條件的課程群組。</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  header="搜尋條件"
  position="right"
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  [style]="{ width: '24rem' }"
>
  <div class="cms-field">
    <label class="cms-field__label" for="filter-keyword">關鍵字</label>
    <input
      pInputText
      id="filter-keyword"
      name="keyword"
      placeholder="群組名稱"
      data-testid="filter-keyword"
      [(ngModel)]="filters.keyword"
    />
  </div>

  <div class="cms-drawer-actions">
    <p-button
      label="清除"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="clearFilters()"
    />
    <p-button
      label="搜尋"
      icon="pi pi-search"
      data-testid="apply-filters"
      (onClick)="applyFilters()"
    />
  </div>
</p-drawer>
