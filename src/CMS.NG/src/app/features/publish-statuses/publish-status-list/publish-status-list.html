<div class="cms-card cms-page-header">
  <div class="cms-page-header__titles">
    <h1 class="cms-page-header__title">發布狀態 PublishStatus</h1>
    <span class="cms-page-header__subtitle">內容發布狀態代碼表</span>
  </div>

  <div class="cms-page-header__actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [text]="true"
      [badge]="hasActiveFilters ? '!' : undefined"
      data-testid="open-filters"
      (onClick)="drawerVisible.set(true)"
    />
    <p-button label="新增" icon="pi pi-plus" data-testid="add-status" (onClick)="goToNew()" />
  </div>
</div>

<div class="cms-card">
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="pageState.rows"
    [first]="pageState.first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [sortField]="sortState.sortField"
    [sortOrder]="sortState.sortOrder"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    styleClass="p-datatable-sm"
    data-testid="status-table"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態名稱 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 7rem" class="cms-cell--flag">
          草稿 <p-sortIcon field="isDraft" />
        </th>
        <th pSortableColumn="isPublished" style="width: 7rem" class="cms-cell--flag">
          已上架 <p-sortIcon field="isPublished" />
        </th>
        <th pSortableColumn="isDiscontinued" style="width: 7rem" class="cms-cell--flag">
          已下架 <p-sortIcon field="isDiscontinued" />
        </th>
        <th pSortableColumn="courseCount" style="width: 8rem" class="cms-cell--number">
          對應課程 <p-sortIcon field="courseCount" />
        </th>
        <th pSortableColumn="promotion2Count" style="width: 8rem" class="cms-cell--number">
          對應活動 <p-sortIcon field="promotion2Count" />
        </th>
        <th style="width: 10rem" class="cms-cell--actions">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-status>
      <tr data-testid="status-row">
        <td>{{ status.pkid }}</td>
        <td>{{ status.description }}</td>
        <td class="cms-cell--flag">
          <p-tag
            [value]="status.isDraft ? '是' : '否'"
            [severity]="status.isDraft ? 'success' : 'secondary'"
          />
        </td>
        <td class="cms-cell--flag">
          <p-tag
            [value]="status.isPublished ? '是' : '否'"
            [severity]="status.isPublished ? 'success' : 'secondary'"
          />
        </td>
        <td class="cms-cell--flag">
          <p-tag
            [value]="status.isDiscontinued ? '是' : '否'"
            [severity]="status.isDiscontinued ? 'success' : 'secondary'"
          />
        </td>
        <td class="cms-cell--number">{{ status.courseCount }}</td>
        <td class="cms-cell--number">{{ status.promotion2Count }}</td>
        <td class="cms-cell--actions">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            [routerLink]="['/publish-statuses', status.pkid]"
          />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            [routerLink]="['/publish-statuses', status.pkid, 'edit']"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            data-testid="delete-status"
            (onClick)="confirmDelete(status)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="8" class="cms-empty">查無符合條件的發布狀態。</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  header="搜尋條件"
  position="right"
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  [style]="{ width: '24rem' }"
>
  <div class="cms-field">
    <label class="cms-field__label" for="filter-keyword">關鍵字</label>
    <input
      pInputText
      id="filter-keyword"
      name="keyword"
      placeholder="狀態名稱"
      data-testid="filter-keyword"
      [(ngModel)]="filters.keyword"
    />
  </div>

  <div class="cms-field">
    <label class="cms-field__label" for="filter-is-draft">草稿</label>
    <p-select
      inputId="filter-is-draft"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      data-testid="filter-is-draft"
      [options]="triStateOptions"
      [(ngModel)]="filters.isDraft"
    />
  </div>

  <div class="cms-field">
    <label class="cms-field__label" for="filter-is-published">已上架</label>
    <p-select
      inputId="filter-is-published"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      data-testid="filter-is-published"
      [options]="triStateOptions"
      [(ngModel)]="filters.isPublished"
    />
  </div>

  <div class="cms-field">
    <label class="cms-field__label" for="filter-is-discontinued">已下架</label>
    <p-select
      inputId="filter-is-discontinued"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      data-testid="filter-is-discontinued"
      [options]="triStateOptions"
      [(ngModel)]="filters.isDiscontinued"
    />
  </div>

  <div class="cms-drawer-actions">
    <p-button
      label="清除"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="clearFilters()"
    />
    <p-button
      label="搜尋"
      icon="pi pi-search"
      data-testid="apply-filters"
      (onClick)="applyFilters()"
    />
  </div>
</p-drawer>
